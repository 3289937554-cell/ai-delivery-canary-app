[tool.ruff]
target-version = "py312"
line-length = 140
exclude = ["evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_domain.py" = ["E402"]
"tests/test_server.py" = ["E402"]
"tests/test_store.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
pretty = true
mypy_path = "src"
exclude = "^evidence/"
